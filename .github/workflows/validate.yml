name: Validate Jekyll build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Verify rendered content
        run: |
          set -e
          test -f _site/index.html
          test -f _site/publications/index.html
          test -f _site/cv/index.html
          for t in "SynLogic" "Perception Bottleneck" "Universal Truthfulness Hyperplane" "In-Context Sharpness" "C-Eval" "Composing Parameter-Efficient"; do
            grep -q "$t" _site/index.html || { echo "MISSING on home: $t"; exit 1; }
            grep -q "$t" _site/publications/index.html || { echo "MISSING on publications page: $t"; exit 1; }
          done
          grep -q "jliugi@connect.ust.hk" _site/index.html
          grep -q "Vicent0205" _site/index.html
          grep -q "junteng88716710" _site/index.html
          grep -q "tbK9jl4AAAAJ" _site/index.html
          grep -q "Zhiyuan Honor Scholarship" _site/cv/index.html
          grep -q "MINIMAX" _site/index.html
          grep -q "Tencent WXG" _site/index.html
          grep -q "Shanghai AI Lab" _site/index.html
          grep -q "Shanghai Jiao Tong University" _site/index.html
          grep -q "Hong Kong University of Science and Technology" _site/index.html
          ! grep -rq "Paper Title Number" _site
          ! grep -rq "GitHub University" _site
          ! grep -rq "ready-to-fork" _site
          ! grep -rq "Skill 1" _site
          test ! -e _site/publication/2009-10-01-paper-title-number-1.html
          echo "ALL CONTENT CHECKS PASSED"
